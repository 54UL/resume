<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saul Aceves — Resume</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700;900&family=Open+Sans:wght@400;500;600;700;800&family=Ubuntu:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toolbar no-print">
  <div class="toolbar-group">
    <label class="tb-label" id="lang-label" for="lang-select">Language</label>
    <select id="lang-select">
      <option value="en-US">English</option>
      <option value="es-MX">Espa&ntilde;ol</option>
    </select>
    <label class="tb-label" id="font-label" for="font-select">Font</label>
    <select id="font-select"></select>
  </div>
  <div class="toolbar-group" style="position:relative;">
    <button class="icon-btn" id="theme-btn" title="Customize theme" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a6 6 0 0 0 0 12 3 3 0 0 1 0 6"/><circle cx="9" cy="10" r="1"/><circle cx="13" cy="8" r="1"/><circle cx="16" cy="12" r="1"/></svg>
    </button>
    <div class="theme-pop no-print" id="theme-pop" hidden></div>
    <button class="btn" id="download-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      <span id="download-btn-label">Download PDF</span>
    </button>
  </div>
</div>

<div class="page-wrap">
  <div id="resume-sheet"></div>
</div>

<div class="credit no-print" id="credit-text">Theme and language choices are remembered on this device only.</div>

<script src="app.js"></script>
</body>
</html>
